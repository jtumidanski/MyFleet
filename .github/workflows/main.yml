name: main

on:
  push:
    branches: [main]
    # Guard 1 of 2 against a self-retrigger loop: the bump-overlay job below
    # pushes a commit that touches only this path. Guard 2 is [skip ci] in that
    # commit's message.
    paths-ignore:
      - 'deploy/k8s/overlays/main/**'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/jtumidanski/myfleet

jobs:
  # ── Build & test gate ────────────────────────────────────────────────────────
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Test
        run: make test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend test
        run: make fe-test

      - name: Frontend build
        run: make fe-build

      # Renders both overlays and asserts their invariants — chiefly that the
      # :80 and :443 IngressRoutes carry identical route sets, so the
      # internal-deny rule cannot go missing from one entrypoint. Gating this
      # inside build-test means a broken overlay blocks `publish`, rather than
      # being discovered when Argo CD syncs it to the cluster.
      #
      # Note the workflow's paths-ignore skips overlay-only pushes (the
      # bump-overlay commits); those change nothing but `newTag`, which cannot
      # affect route parity.
      - name: Install kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check manifests
        run: make manifests

  # ── Publish container images to GHCR ─────────────────────────────────────────
  publish:
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, fleet-service, media-service, notification-service, web]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Vulnerability scan (Trivy) ────────────────────────────────────────────────
  trivy:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      # Scan every service even when one fails — fail-fast cancels the siblings
      # and hides their findings until the first failure is fixed.
      fail-fast: false
      matrix:
        service: [auth-service, fleet-service, media-service, notification-service, web]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan — ${{ matrix.service }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # ── Version tagging ───────────────────────────────────────────────────────────
  tag:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next semver tag
        id: semver
        run: |
          # Find latest tag of the form vMAJOR.MINOR.PATCH; default to v0.0.0
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n1)
          latest=${latest:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${latest#v}"
          patch=$((patch + 1))
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

      - name: Push version tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.semver.outputs.tag }}"
          git push origin "${{ steps.semver.outputs.tag }}"

  # ── Bump the deployed image SHAs ──────────────────────────────────────────────
  bump-overlay:
    needs: [publish, trivy]
    runs-on: ubuntu-latest
    # Serialize bump-overlay across overlapping runs (e.g. two merges to main in
    # quick succession) so a later run's push can never be undone by an earlier
    # run finishing after it. Scoped to this job, not the whole workflow, so
    # build-test/publish/trivy for different commits can still run in parallel —
    # only the overlay-pinning push needs to be a single queue. Never cancel a
    # queued/running bump: cancelling mid-push risks a half-written commit.
    concurrency:
      group: bump-overlay
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pin overlay images to this commit
        run: |
          set -euo pipefail
          # Stale-run guard: main may have moved past the commit this run built
          # if a later merge's bump-overlay already landed while this run was
          # still going through build-test/publish/trivy. Rewriting to this
          # run's (older) SHA would roll the overlay backwards while every step
          # still stays green, so bail out loudly instead of pinning stale bits.
          tip="$(git rev-parse HEAD)"
          if [ "$tip" != "${{ github.sha }}" ]; then
            echo "main's tip is now $tip, not this run's ${{ github.sha }} — a newer push already landed (or will bump the overlay itself). Skipping to avoid rewriting the overlay to a stale SHA."
            exit 0
          fi
          f=deploy/k8s/overlays/main/kustomization.yaml
          # Rewrite every `newTag:` in the images block to this commit's SHA.
          # Argo CD then sees a real manifest diff and rolls the Deployments.
          sed -i -E "s/^(    newTag: ).*$/\1${{ github.sha }}/" "$f"
          # `if` guards the check so a clean diff does not trip `set -e`.
          if git diff --quiet "$f"; then
            echo "already pinned to this SHA — nothing to bump"
            exit 0
          fi
          # Fail loudly if the rewrite missed an image rather than deploying a
          # partially-pinned overlay.
          test "$(grep -c "    newTag: ${{ github.sha }}" "$f")" -eq 5

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$f"
          # [skip ci] is guard 2 of 2 against retriggering this workflow;
          # paths-ignore on the push trigger is guard 1.
          git commit -m "chore(deploy): pin main overlay to ${{ github.sha }} [skip ci]"
          git push origin main
