name: main

on:
  push:
    branches: [main]
    # Guard 1 of 2 against a self-retrigger loop: the bump-overlay job below
    # pushes a commit that touches only this path. Guard 2 is [skip ci] in that
    # commit's message.
    paths-ignore:
      - 'deploy/k8s/overlays/main/**'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/jtumidanski/myfleet

# The verification gate (backend + frontend + manifests) and `publish` run
# concurrently. Publishing is safe to start before the gate finishes because a
# SHA-tagged image is inert: nothing resolves `…-<service>:<sha>` until
# `bump-overlay` writes that SHA into the overlay.
#
# `:latest` is NOT inert — deploy/k8s/base/*/deployment.yaml all reference it,
# and it is the seed a fresh cluster syncs against before the first bump (see
# the bootstrap section of docs/runbooks/k3s-deployment.md). So `publish` pushes
# the SHA tag only, and the `retag-latest` job below moves `:latest` afterwards,
# behind the same gate as `bump-overlay`. An untested or vulnerable commit can
# therefore be neither tagged, nor deployed, nor made the bootstrap seed.
#
# The cost of ungating `publish` is that a commit failing the gate still burns
# its 5 publish jobs. That is ~2.5 minutes of runner time on a doomed commit,
# traded for ~3 minutes off the path to a running deployment on every good one.
jobs:
  # ── Verification gate: Go ────────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          # Cache handled explicitly below. setup-go's built-in cache derives
          # its key from OS/arch/go-version/file-hash only, with no way to
          # namespace it and no restore-keys fallback — so every Go job in the
          # repo computes the same key and races to save. Observed on run
          # 30760611639: lint-go won, backend logged "Failed to save: Unable to
          # reserve cache … another job may be creating this cache", and the
          # cache that landed was golangci-lint's GOCACHE, which holds no -race
          # objects and so does nothing for `make test`.
          cache: false

      # Keyed per workload, so the race-instrumented objects `make test` needs
      # are not overwritten by a lint job's cache. The restore-keys fallback
      # means a dependency bump degrades to a warm-ish cache rather than a cold
      # one. Shares a prefix with pr.yml's backend job on purpose: they do the
      # same work, so a PR run should restore what main last built.
      - name: Cache Go build and module caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum', 'go.work.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Test
        run: make test

  # ── Verification gate: web ───────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend test
        run: make fe-test

      - name: Frontend build
        run: make fe-build

  # ── Verification gate: deploy manifests ──────────────────────────────────────
  # Renders both overlays and asserts their invariants — chiefly that the :80
  # and :443 IngressRoutes carry identical route sets, so the internal-deny rule
  # cannot go missing from one entrypoint. A broken overlay blocks `bump-overlay`
  # rather than being discovered when Argo CD syncs it to the cluster.
  #
  # Note the workflow's paths-ignore skips overlay-only pushes (the bump-overlay
  # commits); those change nothing but `newTag`, which cannot affect route parity.
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check manifests
        run: make manifests

      # See pr.yml's manifests job for why this lives here. On this workflow it
      # is also a deploy gate: bump-overlay waits on `manifests`, so a Carfax
      # template that has drifted between the TS default, the served
      # config.json and the ConfigMap cannot reach the cluster.
      - name: Check Carfax URL template
        run: make carfax-template

  # ── Publish container images to GHCR ─────────────────────────────────────────
  # Deliberately has no `needs`: see the note above the jobs block.
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, fleet-service, media-service, notification-service, web]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          # SHA tag only. `retag-latest` moves `:latest` once the gate passes.
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          # No `cache-from`/`cache-to`. The GHA layer cache was measured to be
          # net-negative here: `cache-to: type=gha,mode=max` spent ~30s per
          # service exporting layers ("preparing build cache 16.2s" + "sending
          # cache export 13.7s" on run 30758773601) to save at most the ~8s
          # `go mod download` layer, since the compile itself is invalidated by
          # any source change regardless. It also crowded the repo's 10 GB
          # Actions cache — 10.6 GB of buildkit blobs across 431 entries, which
          # was evicting the Go build cache that `backend` actually benefits
          # from. Dropping it makes each build cold and still faster.


  # ── Vulnerability scan (Trivy) ────────────────────────────────────────────────
  trivy:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      # Scan every service even when one fails — fail-fast cancels the siblings
      # and hides their findings until the first failure is fixed.
      fail-fast: false
      matrix:
        service: [auth-service, fleet-service, media-service, notification-service, web]
    # No checkout: this job resolves an image by ref and reads nothing from the
    # repository. Reinstate it if a .trivyignore is ever added.
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan — ${{ matrix.service }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # ── Move :latest onto the verified image ─────────────────────────────────────
  # deploy/k8s/base/*/deployment.yaml reference `:latest`, so this tag is a real
  # deploy input for a fresh cluster's first sync — it gets the same gate as
  # bump-overlay, Trivy included. imagetools re-points the existing manifest
  # list; it does not rebuild or re-upload any layer.
  retag-latest:
    needs: [backend, frontend, manifests, publish, trivy]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, fleet-service, media-service, notification-service, web]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point :latest at ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            --tag "${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest" \
            "${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}"

  # ── Version tagging ───────────────────────────────────────────────────────────
  tag:
    needs: [backend, frontend, manifests, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next semver tag
        id: semver
        run: |
          # Find latest tag of the form vMAJOR.MINOR.PATCH; default to v0.0.0
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n1)
          latest=${latest:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${latest#v}"
          patch=$((patch + 1))
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

      - name: Push version tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.semver.outputs.tag }}"
          git push origin "${{ steps.semver.outputs.tag }}"

  # ── Bump the deployed image SHAs ──────────────────────────────────────────────
  bump-overlay:
    needs: [backend, frontend, manifests, publish, trivy]
    runs-on: ubuntu-latest
    # Serialize bump-overlay across overlapping runs (e.g. two merges to main in
    # quick succession) so a later run's push can never be undone by an earlier
    # run finishing after it. Scoped to this job, not the whole workflow, so the
    # gate/publish/trivy jobs for different commits can still run in parallel —
    # only the overlay-pinning push needs to be a single queue. Never cancel a
    # queued/running bump: cancelling mid-push risks a half-written commit.
    concurrency:
      group: bump-overlay
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pin overlay images to this commit
        run: |
          set -euo pipefail
          # Stale-run guard: main may have moved past the commit this run built
          # if a later merge's bump-overlay already landed while this run was
          # still going through the gate/publish/trivy. Rewriting to this run's
          # (older) SHA would roll the overlay backwards while every step still
          # stays green, so bail out loudly instead of pinning stale bits.
          tip="$(git rev-parse HEAD)"
          if [ "$tip" != "${{ github.sha }}" ]; then
            echo "main's tip is now $tip, not this run's ${{ github.sha }} — a newer push already landed (or will bump the overlay itself). Skipping to avoid rewriting the overlay to a stale SHA."
            exit 0
          fi
          f=deploy/k8s/overlays/main/kustomization.yaml
          # Rewrite every `newTag:` in the images block to this commit's SHA.
          # Argo CD then sees a real manifest diff and rolls the Deployments.
          sed -i -E "s/^(    newTag: ).*$/\1${{ github.sha }}/" "$f"
          # `if` guards the check so a clean diff does not trip `set -e`.
          if git diff --quiet "$f"; then
            echo "already pinned to this SHA — nothing to bump"
            exit 0
          fi
          # Fail loudly if the rewrite missed an image rather than deploying a
          # partially-pinned overlay.
          test "$(grep -c "    newTag: ${{ github.sha }}" "$f")" -eq 5

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$f"
          # [skip ci] is guard 2 of 2 against retriggering this workflow;
          # paths-ignore on the push trigger is guard 1.
          git commit -m "chore(deploy): pin main overlay to ${{ github.sha }} [skip ci]"
          git push origin main
