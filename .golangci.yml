# Root golangci-lint v2 config — the single config source for every Go module
# in the workspace. tools/lint.sh runs golangci-lint from each module's own
# directory with this file passed via -c; do not add per-module configs.
version: "2"

linters:
  # The v2 `standard` default group: errcheck, govet, ineffassign,
  # staticcheck, unused. Membership is fixed by the version pin in
  # tools/lint.versions.
  default: standard

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      # Group intra-repo imports separately. gofumpt's module-path stays UNSET —
      # one shared config serves six modules; golangci-lint derives it per
      # module from each go.mod.
      local-prefixes:
        - github.com/jtumidanski/myfleet
