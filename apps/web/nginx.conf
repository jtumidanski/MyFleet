# Static server for the MyFleet SPA. All non-asset paths fall back to
# index.html so client-side routing (react-router) works on deep links /
# refresh. The browser's /api/* XHRs never reach this container — Traefik
# routes those to the backend services (the web router is low priority and
# only catches what the /api/* routers do not).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime configuration, replaced in Kubernetes by the `web-config`
    # ConfigMap mounted over this directory. It must not be cached: a browser
    # serving a stale template long after the ConfigMap changed would quietly
    # defeat the entire point of choosing runtime configuration over a
    # build-time value.
    location = /config/config.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
