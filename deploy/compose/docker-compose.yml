name: myfleet
services:
  mailpit:
    image: axllent/mailpit:latest
    environment:
      # Serve the UI under /mail so the Traefik route below needs no
      # stripprefix — a stripped prefix breaks the SPA's asset paths.
      MP_WEBROOT: mail
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      # Published as well as routed, so the inbox is reachable even when
      # Traefik is not up — this is the first thing a developer checks.
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/mail/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=PathPrefix(`/mail`)"
      - "traefik.http.routers.mailpit.entrypoints=web"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"

  traefik:
    # v3.1's Docker provider pins client API v1.24, which daemons from Docker
    # 25 onward refuse ("client version 1.24 is too old. Minimum supported API
    # version is 1.40"). The provider then discovers NO containers, so every
    # /api/* route 404s while the stack itself looks perfectly healthy — the
    # failure is silent unless you read the Traefik log. v3.7 negotiates the
    # API version with the daemon.
    image: traefik:v3.7.10
    command: --configFile=/etc/traefik/traefik.yml
    ports: ["80:80", "8081:8080"]
    volumes:
      - ./traefik:/etc/traefik:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes:
      - ./data/pg:/var/lib/postgresql/data
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X brokers=localhost:9092 | grep -q 'Healthy:.*true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  auth-service:
    build:
      context: ../..
      dockerfile: apps/auth-service/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      FLEET_SERVICE_URL: http://fleet-service:8080
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_KID: ${JWT_KID:-kid-1}
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM}
      OIDC_STATE_SECRET: ${OIDC_STATE_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      # Seeds auth.platform_admins at startup and at first login; never consulted
      # per request (FR-ADMIN-AUTH-3). Empty by default so a local stack has no
      # platform admin unless one is asked for.
      PLATFORM_ADMIN_BOOTSTRAP_EMAILS: ${PLATFORM_ADMIN_BOOTSTRAP_EMAILS:-}
      # Without this the service falls back to its `true` default and stamps
      # Secure on the OIDC state and refresh cookies, which this stack serves
      # over plaintext HTTP. deploy/k8s/base/auth-service/configmap.yaml
      # already sets false for the same reason; compose was simply missing it.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      - "traefik.enable=true"
      # Route /api/auth/* to this service and strip only the /api mount point
      # so the service sees its own /auth/* routes, which already carry the
      # /auth segment.
      # Priority 200: refuse every /internal/* surface before the
      # priority-100 route can proxy it. Those routes carry no JWT and two
      # of them delete data; notification-service is the load-bearing case,
      # since its stripprefix removes the FULL /api/notifications prefix.
      - "traefik.http.middlewares.internal-deny.ipallowlist.sourcerange=255.255.255.255/32"
      - "traefik.http.routers.auth-internal.rule=PathRegexp(`(?i)^/+api/+auth[^/]*/*internal`)"
      - "traefik.http.routers.auth-internal.entrypoints=web"
      - "traefik.http.routers.auth-internal.priority=200"
      - "traefik.http.routers.auth-internal.middlewares=internal-deny"
      - "traefik.http.routers.auth-internal.service=auth"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/auth`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.routers.auth.middlewares=auth-stripprefix"
      - "traefik.http.middlewares.auth-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.services.auth.loadbalancer.server.port=8080"

  fleet-service:
    build:
      context: ../..
      dockerfile: apps/fleet-service/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      MEDIA_INTERNAL_URL: http://media-service:8080
      # Platform admin console: the purge fan-out targets and how long a purge
      # stays cancellable. Same values as the base ConfigMap.
      AUTH_INTERNAL_URL: http://auth-service:8080
      NOTIFICATION_INTERNAL_URL: http://notification-service:8080
      ADMIN_PURGE_RECOVERY_WINDOW: 120h
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      - "traefik.enable=true"
      # Route /api/fleet/* to this service and strip the /api/fleet prefix so
      # the service sees bare paths (/fleets, /invites, /internal/...).
      # Priority 200: refuse every /internal/* surface before the
      # priority-100 route can proxy it. Those routes carry no JWT and two
      # of them delete data; notification-service is the load-bearing case,
      # since its stripprefix removes the FULL /api/notifications prefix.
      - "traefik.http.middlewares.internal-deny.ipallowlist.sourcerange=255.255.255.255/32"
      - "traefik.http.routers.fleet-internal.rule=PathRegexp(`(?i)^/+api/+fleet[^/]*/*internal`)"
      - "traefik.http.routers.fleet-internal.entrypoints=web"
      - "traefik.http.routers.fleet-internal.priority=200"
      - "traefik.http.routers.fleet-internal.middlewares=internal-deny"
      - "traefik.http.routers.fleet-internal.service=fleet"
      - "traefik.http.routers.fleet.rule=PathPrefix(`/api/fleet`)"
      - "traefik.http.routers.fleet.entrypoints=web"
      - "traefik.http.routers.fleet.middlewares=fleet-stripprefix"
      - "traefik.http.middlewares.fleet-stripprefix.stripprefix.prefixes=/api/fleet"
      - "traefik.http.services.fleet.loadbalancer.server.port=8080"

  media-service:
    build:
      context: ../..
      dockerfile: apps/media-service/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "false"
      MEDIA_BUCKET: ${MEDIA_BUCKET}
      MEDIA_WORKERS: ${MEDIA_WORKERS:-2}
      MEDIA_ALLOWED_CONTENT_TYPES: ${MEDIA_ALLOWED_CONTENT_TYPES:-image/jpeg,image/png,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # Route /api/media/* to this service and strip only the /api mount point
      # so the service sees its own /media/... routes (/media,
      # /media/{id}/confirm, ...), which already carry the /media segment.
      # Priority 200: refuse every /internal/* surface before the
      # priority-100 route can proxy it. Those routes carry no JWT and two
      # of them delete data; notification-service is the load-bearing case,
      # since its stripprefix removes the FULL /api/notifications prefix.
      - "traefik.http.middlewares.internal-deny.ipallowlist.sourcerange=255.255.255.255/32"
      - "traefik.http.routers.media-internal.rule=PathRegexp(`(?i)^/+api/+media[^/]*/*internal`)"
      - "traefik.http.routers.media-internal.entrypoints=web"
      - "traefik.http.routers.media-internal.priority=200"
      - "traefik.http.routers.media-internal.middlewares=internal-deny"
      - "traefik.http.routers.media-internal.service=media"
      - "traefik.http.routers.media.rule=PathPrefix(`/api/media`)"
      - "traefik.http.routers.media.entrypoints=web"
      - "traefik.http.routers.media.middlewares=media-stripprefix"
      - "traefik.http.middlewares.media-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.services.media.loadbalancer.server.port=8080"

  notification-service:
    build:
      context: ../..
      dockerfile: apps/notification-service/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      FLEET_INTERNAL_URL: http://fleet-service:8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SMTP_ENABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS_MODE: none
      SMTP_FROM_ADDRESS: invites@myfleet.local
      SMTP_FROM_NAME: MyFleet
      PUBLIC_WEB_URL: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      fleet-service:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # Route /api/notifications/* to this service and strip the prefix so the
      # service sees bare paths (/notifications, /notification-preferences, ...).
      # Priority 200: refuse every /internal/* surface before the
      # priority-100 route can proxy it. Those routes carry no JWT and two
      # of them delete data; notification-service is the load-bearing case,
      # since its stripprefix removes the FULL /api/notifications prefix.
      - "traefik.http.middlewares.internal-deny.ipallowlist.sourcerange=255.255.255.255/32"
      - "traefik.http.routers.notifications-internal.rule=PathRegexp(`(?i)^/+api/+notifications[^/]*/*internal`)"
      - "traefik.http.routers.notifications-internal.entrypoints=web"
      - "traefik.http.routers.notifications-internal.priority=200"
      - "traefik.http.routers.notifications-internal.middlewares=internal-deny"
      - "traefik.http.routers.notifications-internal.service=notifications"
      - "traefik.http.routers.notifications.rule=PathPrefix(`/api/notifications`)"
      - "traefik.http.routers.notifications.entrypoints=web"
      - "traefik.http.routers.notifications.middlewares=notifications-stripprefix"
      - "traefik.http.middlewares.notifications-stripprefix.stripprefix.prefixes=/api/notifications"
      - "traefik.http.services.notifications.loadbalancer.server.port=8080"

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    depends_on:
      - auth-service
      - fleet-service
      - media-service
      - notification-service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      - "traefik.enable=true"
      # Catch-all for the SPA at the root path. Low priority so the more
      # specific /api/* PathPrefix routers (auth/fleet/media/notifications)
      # always win; only paths they don't match fall through to the SPA,
      # whose nginx serves index.html for client-side routing.
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.services.web.loadbalancer.server.port=80"
