apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
data:
  APP_BASE_URL: "http://localhost"
  PORT: "8080"
  LOG_LEVEL: "info"
  JWT_ISSUER: "https://myfleet.example.com"
  JWT_AUDIENCE: "myfleet"
  JWT_KID: "kid-1"
  # Traefik strips only /api (auth-stripprefix), and the OIDC callback route
  # is /auth/callback (apps/auth-service/internal/oidc/resource.go), so the
  # public path is /api/auth/callback. The main overlay swaps in the public
  # host.
  GOOGLE_REDIRECT_URL: "http://localhost/api/auth/callback"
  FLEET_SERVICE_URL: "http://fleet-service:8080"
  COOKIE_SECURE: "false"
  # Seeds auth.platform_admins at startup and at first login; NEVER consulted
  # per request (FR-ADMIN-AUTH-3). The table is the runtime source of truth, so
  # revoking an admin is a DELETE with no redeploy.
  PLATFORM_ADMIN_BOOTSTRAP_EMAILS: "jtumidanski@gmail.com"
