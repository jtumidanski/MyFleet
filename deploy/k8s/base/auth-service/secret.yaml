apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: myfleet
type: Opaque
# PLACEHOLDER VALUES — DO NOT COMMIT REAL SECRETS.
# Inject real values at deploy time via:
#   kubectl create secret generic auth-service-secret \
#     --from-literal=DATABASE_URL='...' \
#     --from-literal=GOOGLE_CLIENT_ID='...' \
#     --from-literal=GOOGLE_CLIENT_SECRET='...' \
#     --from-literal=JWT_PRIVATE_KEY_PEM='...' \
#     --from-literal=OIDC_STATE_SECRET='...' \
#     --dry-run=client -o yaml | kubectl apply -f -
stringData:
  DATABASE_URL: "postgres://PLACEHOLDER_USER:PLACEHOLDER_PASS@postgres:5432/myfleet?sslmode=disable&search_path=auth"
  GOOGLE_CLIENT_ID: "PLACEHOLDER_GOOGLE_CLIENT_ID"
  GOOGLE_CLIENT_SECRET: "PLACEHOLDER_GOOGLE_CLIENT_SECRET"
  JWT_PRIVATE_KEY_PEM: "PLACEHOLDER_JWT_PRIVATE_KEY_PEM"
  OIDC_STATE_SECRET: "PLACEHOLDER_OIDC_STATE_SECRET"
