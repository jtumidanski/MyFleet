---
# ServiceAccount for Traefik so it can watch Kubernetes resources
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: myfleet

---
# ClusterRole granting Traefik read access to services, endpoints, secrets, and Traefik CRDs
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: myfleet-traefik
rules:
  - apiGroups: [""]
    resources: [services, endpoints, secrets]
    verbs: [get, list, watch]
  - apiGroups: [extensions, networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [extensions, networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
  - apiGroups: [traefik.io, traefik.containo.us]
    resources:
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewares
      - middlewaretcps
      - tlsoptions
      - tlsstores
      - traefikservices
      - serverstransports
    verbs: [get, list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: myfleet-traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: myfleet-traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: myfleet

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: myfleet
  labels:
    app: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.1
          args:
            - --providers.kubernetescrd
            - --providers.kubernetesingress
            - --entrypoints.web.address=:8000
            - --api.insecure=true
          ports:
            - containerPort: 8000
              name: web
            - containerPort: 8080
              name: dashboard
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"

---
# NodePort service so Traefik is reachable from outside the cluster (local dev)
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: myfleet
  labels:
    app: traefik
spec:
  type: NodePort
  selector:
    app: traefik
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
      name: web
    - port: 8080
      targetPort: 8080
      name: dashboard

---
# Strip-prefix Middlewares for each service path prefix
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-stripprefix
  namespace: myfleet
spec:
  stripPrefix:
    prefixes:
      - /api/auth

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: fleet-stripprefix
  namespace: myfleet
spec:
  stripPrefix:
    prefixes:
      - /api/fleet

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: media-stripprefix
  namespace: myfleet
spec:
  stripPrefix:
    prefixes:
      - /api/media

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: notifications-stripprefix
  namespace: myfleet
spec:
  stripPrefix:
    prefixes:
      - /api/notifications

---
# IngressRoute — routes all /api/<service>/* paths to the respective ClusterIP services
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: myfleet-routes
  namespace: myfleet
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/api/auth`)
      kind: Rule
      middlewares:
        - name: auth-stripprefix
      services:
        - name: auth-service
          port: 8080
    - match: PathPrefix(`/api/fleet`)
      kind: Rule
      middlewares:
        - name: fleet-stripprefix
      services:
        - name: fleet-service
          port: 8080
    - match: PathPrefix(`/api/media`)
      kind: Rule
      middlewares:
        - name: media-stripprefix
      services:
        - name: media-service
          port: 8080
    - match: PathPrefix(`/api/notifications`)
      kind: Rule
      middlewares:
        - name: notifications-stripprefix
      services:
        - name: notification-service
          port: 8080
