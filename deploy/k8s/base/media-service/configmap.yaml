apiVersion: v1
kind: ConfigMap
metadata:
  name: media-service-config
data:
  PORT: "8080"
  LOG_LEVEL: "info"
  JWKS_URL: "http://auth-service:8080/.well-known/jwks.json"
  KAFKA_BROKERS: "redpanda:9092"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_USE_SSL: "false"
  MEDIA_BUCKET: "myfleet-media"
  MEDIA_WORKERS: "2"
  MEDIA_MAX_UPLOAD_BYTES: "26214400"
  # How many lazy card-variant generations may run at once, across all media
  # objects (task-013). Bounds the cost of a cold vehicles grid: without it,
  # twelve cards could spawn twelve simultaneous full-size image decodes.
  # "0" turns lazy generation off entirely — missing cards are then served as
  # thumbnails, which is the pre-task behaviour and a supported state.
  MEDIA_LAZY_VARIANT_CONCURRENCY: "4"
  # How many orphaned derived rows the hourly purge sweep reconciles per tick
  # (task-023). Orphans are media_variants and media_variant_failures rows whose
  # media object no longer exists — state earlier versions of the sweep left
  # behind. The cap keeps the first tick after a deploy short instead of turning
  # it into an unbounded bucket-deletion loop against an accumulated backlog.
  # The cap is applied per table and its unit differs between them: for
  # media_variants it bounds ROWS, for media_variant_failures it bounds MEDIA
  # OBJECTS, so an object's ledger is never left half-reconciled. One tick can
  # therefore delete more ledger rows than this number.
  # "0" turns the reconciliation pass off entirely; the per-object purge is
  # unaffected either way.
  MEDIA_PURGE_RECONCILE_LIMIT: "500"
  # Server-side upload allowlist (PRD FR-MEDIA-2). This is a security control,
  # not a UX affordance: the client's `accept` attribute is a convenience only.
  # Adding a document type here is safe; renderable image types are hard-coded
  # in mediaobject/contenttype.go because they need a decoder.
  MEDIA_ALLOWED_CONTENT_TYPES: "image/jpeg,image/png,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv"
