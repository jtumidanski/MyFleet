apiVersion: v1
kind: ConfigMap
metadata:
  name: media-service-config
  namespace: myfleet
data:
  PORT: "8080"
  LOG_LEVEL: "info"
  JWKS_URL: "http://auth-service:8080/.well-known/jwks.json"
  KAFKA_BROKERS: "redpanda:9092"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_USE_SSL: "false"
  MEDIA_BUCKET: "myfleet-media"
  MEDIA_WORKERS: "2"
