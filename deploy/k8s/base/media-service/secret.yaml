apiVersion: v1
kind: Secret
metadata:
  name: media-service-secret
  namespace: myfleet
type: Opaque
# PLACEHOLDER VALUES — DO NOT COMMIT REAL SECRETS.
# Inject real values at deploy time via:
#   kubectl create secret generic media-service-secret \
#     --from-literal=DATABASE_URL='...' \
#     --from-literal=MINIO_ACCESS_KEY='...' \
#     --from-literal=MINIO_SECRET_KEY='...' \
#     --dry-run=client -o yaml | kubectl apply -f -
stringData:
  DATABASE_URL: "postgres://PLACEHOLDER_USER:PLACEHOLDER_PASS@postgres:5432/myfleet?sslmode=disable&search_path=media"
  MINIO_ACCESS_KEY: "PLACEHOLDER_MINIO_ROOT_USER"
  MINIO_SECRET_KEY: "PLACEHOLDER_MINIO_ROOT_PASSWORD"
