apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secret
  namespace: myfleet
type: Opaque
# PLACEHOLDER VALUES — DO NOT COMMIT REAL SECRETS.
# Inject real values at deploy time via:
#   kubectl create secret generic notification-service-secret \
#     --from-literal=DATABASE_URL='...' \
#     --dry-run=client -o yaml | kubectl apply -f -
stringData:
  DATABASE_URL: "postgres://PLACEHOLDER_USER:PLACEHOLDER_PASS@postgres:5432/myfleet?sslmode=disable&search_path=notification"
