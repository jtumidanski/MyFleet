apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
        # UID 101 = nginx in nginxinc/nginx-unprivileged.
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: web
          image: ghcr.io/jtumidanski/myfleet-web:latest
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          volumeMounts:
            # nginx writes its pid and temp bodies at runtime; the root
            # filesystem is read-only, so give it tmpfs.
            - name: nginx-tmp
              mountPath: /tmp
            # Runtime config. Mounted over the directory the image bakes in
            # (not with subPath) so a ConfigMap edit reaches running pods.
            - name: web-config
              mountPath: /usr/share/nginx/html/config
              readOnly: true
      volumes:
        - name: nginx-tmp
          emptyDir: {}
        - name: web-config
          configMap:
            name: web-config
