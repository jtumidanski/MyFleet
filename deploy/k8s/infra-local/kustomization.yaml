apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every resource here belongs in the myfleet namespace, exactly as base/ does.
# Without this the namespace-less manifests (traefik.yaml, secrets-local.yaml,
# ingressroute.yaml) render into whatever namespace the caller happens to be
# in, and the traefik ClusterRoleBinding is rejected outright
# (subjects[0].namespace: Required value). Setting it here also lets kustomize
# fill in that subject namespace.
namespace: myfleet

# Dev-only infrastructure + placeholder Secrets + dev Traefik. Referenced only
# by overlays/local. Never include this from an overlay that targets a shared
# cluster — see traefik.yaml for why.
resources:
  - secrets-local.yaml
  - postgres.yaml
  - minio.yaml
  - redpanda.yaml
  - traefik.yaml
  - ingressroute.yaml
