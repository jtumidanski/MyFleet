---
# Mailpit — LOCAL-ONLY SMTP sink and web inbox (task-009, FR-DEV-1/3).
#
# Deliberately has NO PersistentVolumeClaim: captured mail is ephemeral, and a
# PVC in infra-local would be a foot-gun if this directory were ever pulled into
# another overlay. tools/check-manifests.sh fails the build if "mailpit" ever
# renders into the main overlay.
#
# Reach the inbox with:
#   kubectl port-forward -n myfleet svc/mailpit 8025:8025
# then open http://localhost:8025
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:latest
          env:
            - name: MP_SMTP_AUTH_ACCEPT_ANY
              value: "true"
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "true"
          ports:
            - containerPort: 1025
              name: smtp
            - containerPort: 8025
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 8025
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app: mailpit
spec:
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: http
      port: 8025
      targetPort: 8025
