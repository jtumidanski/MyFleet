apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../infra-local

# All service deployments run as a single replica in local dev
replicas:
  - name: auth-service
    count: 1
  - name: fleet-service
    count: 1
  - name: media-service
    count: 1
  - name: notification-service
    count: 1
  - name: postgres
    count: 1
  - name: minio
    count: 1
  - name: redpanda
    count: 1
  - name: traefik
    count: 1
  - name: web
    count: 1

# Override images to use local/latest tags for local development
images:
  - name: ghcr.io/jtumidanski/myfleet-auth-service
    newTag: local
  - name: ghcr.io/jtumidanski/myfleet-fleet-service
    newTag: local
  - name: ghcr.io/jtumidanski/myfleet-media-service
    newTag: local
  - name: ghcr.io/jtumidanski/myfleet-notification-service
    newTag: local
  - name: ghcr.io/jtumidanski/myfleet-web
    newTag: local

# Patch to relax imagePullPolicy for local images
patches:
  - target:
      kind: Deployment
      name: auth-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: fleet-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: media-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: notification-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  # Local mail goes to the bundled Mailpit sink. Putting this override in the
  # OVERLAY rather than the base is what keeps SMTP_TLS_MODE=none structurally
  # unable to reach main (FR-DEV-2).
  - target:
      kind: ConfigMap
      name: notification-service-config
    patch: |-
      - op: replace
        path: /data/SMTP_ENABLED
        value: "true"
      - op: replace
        path: /data/SMTP_HOST
        value: "mailpit"
      - op: replace
        path: /data/SMTP_PORT
        value: "1025"
      - op: replace
        path: /data/SMTP_TLS_MODE
        value: "none"
      - op: replace
        path: /data/SMTP_FROM_ADDRESS
        value: "invites@myfleet.home"
      - op: replace
        path: /data/PUBLIC_WEB_URL
        value: "http://myfleet.home"
