apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reference base
resources:
  - ../../base

# All service deployments run as a single replica in local dev
replicas:
  - name: auth-service
    count: 1
  - name: fleet-service
    count: 1
  - name: media-service
    count: 1
  - name: notification-service
    count: 1
  - name: postgres
    count: 1
  - name: minio
    count: 1
  - name: redpanda
    count: 1
  - name: traefik
    count: 1

# Override images to use local/latest tags for local development
images:
  - name: ghcr.io/jtumidanski/myfleet-auth-service
    newTag: local
  - name: ghcr.io/jtumidanski/myfleet-fleet-service
    newTag: local
  - name: ghcr.io/jtumidanski/myfleet-media-service
    newTag: local
  - name: ghcr.io/jtumidanski/myfleet-notification-service
    newTag: local

# Patch to relax imagePullPolicy for local images
patches:
  - target:
      kind: Deployment
      name: auth-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: fleet-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: media-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: notification-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
