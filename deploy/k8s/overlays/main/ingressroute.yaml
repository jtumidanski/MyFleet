---
# Terminates any public request aimed at fleet-service's /internal/* endpoints.
# Those routes are registered WITHOUT JWT (apps/fleet-service/cmd/main.go) on
# the assumption that they are only reachable from inside the cluster; exposing
# fleet-service on the internet invalidates that assumption, and
# /internal/maintenance/due in particular dumps every non-ok maintenance
# schedule across every fleet with no parameters at all.
#
# ipAllowList with an unroutable /32 allows nobody, so every matching request is
# refused with 403 before the request is ever proxied to fleet-service. This is
# a routing-layer block only: it lives on bee's Traefik, so in-cluster callers
# (auth-service FLEET_SERVICE_URL, notification-service FLEET_INTERNAL_URL —
# both plain http://fleet-service:8080 ClusterVIP, see base/*/configmap.yaml)
# never traverse it and are completely unaffected.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-deny
spec:
  ipAllowList:
    sourceRange:
      - 255.255.255.255/32
    rejectStatusCode: 403

---
# ==========================================================================
# THE route set. Defined once here; mirrored onto :443 by kustomize.
# ==========================================================================
# Two IngressRoute objects are unavoidable. A Traefik IngressRoute carrying a
# `tls` section produces a TLS-ONLY router, even when `entryPoints` also lists
# `web`. Verified empirically against bee's Traefik 3.6.13: a probe IngressRoute
# with entryPoints [web, websecure] and `tls: {}` answered 200 on :443 and 404
# on :80. So one object cannot serve both ports, and adding `websecure` here
# would silently break http://myfleet.home.
#
# What IS avoidable is duplicating the routes. The `replacements` block in
# kustomization.yaml copies `spec.routes` from this object into
# myfleet-routes-tls at build time, so the list below is the single source of
# truth for both entrypoints. Edit it here and both ports change together.
#
# That matters because the priority-200 internal-deny route is a security
# control: if it were present on one entrypoint and missing on the other,
# fleet-service's unauthenticated /internal/* surface would be exposed on the
# port that lost it. Hand-maintained duplication would make that a one-typo
# mistake; the replacement makes it unrepresentable. The runbook's post-deploy
# checks still probe the deny rule on :80 AND :443 as a backstop.
#
# Both ports are required:
#   * :443 — how the public reaches us. Cloudflare connects to the origin over
#     TLS; before the TLS twin existed, every such request found no matching
#     router and got Traefik's default `404 page not found`. That was the
#     original symptom.
#   * :80  — myfleet.home over plain HTTP, used for health checks that must not
#     depend on Cloudflare or on trusting a self-signed cert.
#
# Priorities are explicit rather than relying on Traefik's rule-length
# ordering: the SPA catch-all must lose to every /api/* route.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: myfleet-routes
spec:
  entryPoints:
    - web
  routes:
    # Must out-prioritise the /api/fleet router below (100) so nothing reaches
    # fleet-service's unauthenticated /internal/* surface from outside.
    #
    # PathRegexp, not PathPrefix, because neither PathPrefix nor stripPrefix is
    # segment-bounded. Verified against traefik 3.6.13 (the version bee runs)
    # driving a chi v5.3.0 router with fleet-service's route shapes:
    #   * Traefik percent-decodes and lexically cleans the path BEFORE matching,
    #     so `/api/fleet/x/../internal/…`, `/api//fleet/internal/…`,
    #     `/api/fleet///internal/…`, `/api/fleet%2finternal/…` and
    #     `/api/fleet/%69nternal/…` all arrive at the muxer already normalised
    #     to `/api/fleet/internal/…` — and all five reached the handler before
    #     this rule existed.
    #   * fleet-stripprefix removes the literal string `/api/fleet`, not a path
    #     segment, so `/api/fleetinternal/maintenance/due` also reached the
    #     handler as `/internal/maintenance/due`. Hence `[^/]*/*` rather than a
    #     mandatory slash: the segment separator is optional.
    # `(?i)` is belt-and-braces (chi is case-sensitive, so `/INTERNAL` already
    # 404s). No legitimate fleet route has a first segment beginning `internal`
    # (they are /fleets, /vehicles, /invites, /fuel-logs, /maintenance-*), so
    # this cannot shadow real traffic.
    #
    # The service reference is inert: internal-deny short-circuits with 403
    # before anything is proxied.
    - match: (Host(`myfleet.tumidanski.com`) || Host(`myfleet.tumidanski.me`) || Host(`myfleet.home`)) && PathRegexp(`(?i)^/+api/+fleet[^/]*/*internal`)
      kind: Rule
      priority: 200
      middlewares:
        - name: internal-deny
      services:
        - name: fleet-service
          port: 8080
    # Same obligation as the fleet-service rule above, for the same reasons.
    # media-service registers GET /internal/media WITHOUT JWT
    # (apps/media-service/cmd/main.go) on the assumption that it is only
    # reachable from inside the cluster; exposing media-service on the internet
    # invalidates that assumption, and /internal/media is a cross-fleet
    # media-existence oracle for anyone who can guess a fleet ID.
    #
    # PathRegexp, not PathPrefix: Traefik normalises the path before matching,
    # and media-stripprefix removes the literal string `/api` rather than a path
    # segment, so `/api/mediainternal/media?...` would otherwise reach the
    # handler as `/internal/media`. Hence `[^/]*/*` — the separator is optional.
    #
    # The service reference is inert: internal-deny short-circuits with 403
    # before anything is proxied.
    - match: (Host(`myfleet.tumidanski.com`) || Host(`myfleet.tumidanski.me`) || Host(`myfleet.home`)) && PathRegexp(`(?i)^/+api/+media[^/]*/*internal`)
      kind: Rule
      priority: 200
      middlewares:
        - name: internal-deny
      services:
        - name: media-service
          port: 8080
    - match: (Host(`myfleet.tumidanski.com`) || Host(`myfleet.tumidanski.me`) || Host(`myfleet.home`)) && PathPrefix(`/api/auth`)
      kind: Rule
      priority: 100
      middlewares:
        - name: auth-stripprefix
      services:
        - name: auth-service
          port: 8080
    - match: (Host(`myfleet.tumidanski.com`) || Host(`myfleet.tumidanski.me`) || Host(`myfleet.home`)) && PathPrefix(`/api/fleet`)
      kind: Rule
      priority: 100
      middlewares:
        - name: fleet-stripprefix
      services:
        - name: fleet-service
          port: 8080
    - match: (Host(`myfleet.tumidanski.com`) || Host(`myfleet.tumidanski.me`) || Host(`myfleet.home`)) && PathPrefix(`/api/media`)
      kind: Rule
      priority: 100
      middlewares:
        - name: media-stripprefix
      services:
        - name: media-service
          port: 8080
    - match: (Host(`myfleet.tumidanski.com`) || Host(`myfleet.tumidanski.me`) || Host(`myfleet.home`)) && PathPrefix(`/api/notifications`)
      kind: Rule
      priority: 100
      middlewares:
        - name: notifications-stripprefix
      services:
        - name: notification-service
          port: 8080
    - match: Host(`myfleet.tumidanski.com`) || Host(`myfleet.tumidanski.me`) || Host(`myfleet.home`)
      kind: Rule
      # Catch-all for the SPA: must lose to every /api/* route above.
      priority: 1
      services:
        - name: web
          port: 80

---
# TLS twin of myfleet-routes above. `spec.routes` is INTENTIONALLY EMPTY here:
# it is populated at build time by the `replacements` block in
# kustomization.yaml, which copies `spec.routes` verbatim from myfleet-routes.
#
# That is what makes the two entrypoints structurally impossible to drift. The
# route set — including the priority-200 internal-deny rule that keeps
# fleet-service's unauthenticated /internal/* surface off the public internet —
# is defined exactly once, above. Editing it there updates both ports.
#
# Do NOT hand-write routes into this object. If you do, kustomize overwrites
# them on the next build and the edit silently disappears.
#
# `myfleet-tls` is a self-signed certificate applied out-of-band alongside the
# service Secrets (deploy/k8s/secrets.yaml, generated per the runbook), for the
# same reason: this overlay ships no Secrets, so Argo CD does not track them and
# `prune: true` cannot remove them. It carries all three hostnames as SANs.
#
# Self-signed is sufficient because Cloudflare in Full (non-strict) mode accepts
# any origin certificate, and the browser only ever sees Cloudflare's valid edge
# certificate. Direct LAN access to myfleet.tumidanski.me warns, as it does for
# home-hub. Full (STRICT) mode would reject this and require a Cloudflare Origin
# Certificate instead.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: myfleet-routes-tls
spec:
  entryPoints:
    - websecure
  routes: []
  tls:
    secretName: myfleet-tls
