---
# TLS certificate for the websecure IngressRoute (myfleet-routes-tls). Without
# it Traefik registers no router on :443 and every public request — Cloudflare
# to the origin, or direct to myfleet.tumidanski.me — gets `404 page not found`.
#
# Generate a self-signed cert covering all three hostnames, then paste the PEMs
# below (or skip the paste and pipe it straight in, which is easier):
#
#   openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
#     -keyout myfleet-tls.key -out myfleet-tls.crt \
#     -subj "/CN=myfleet.tumidanski.com" \
#     -addext "subjectAltName=DNS:myfleet.tumidanski.com,DNS:myfleet.tumidanski.me,DNS:myfleet.home"
#
#   base64 -w0 myfleet-tls.crt   # -> data.tls.crt below
#   base64 -w0 myfleet-tls.key   # -> data.tls.key below
#
# Fill in the two fields below rather than appending a generated Secret with
# `>>`. `kubectl create secret … -o yaml` emits no leading `---`, so appending
# it fuses it into the preceding document and silently drops the four
# *-service-secret Secrets on the next apply. Verify with
# `kubectl apply -f deploy/k8s/secrets.yaml --dry-run=client` — expect five
# lines, not one.
#
# Self-signed is fine behind Cloudflare Full (non-strict): the browser only sees
# Cloudflare's edge cert. Full (STRICT) rejects it — that needs a Cloudflare
# Origin Certificate instead.
apiVersion: v1
kind: Secret
metadata:
  name: myfleet-tls
  namespace: myfleet
type: kubernetes.io/tls
data:
  tls.crt: REPLACE_ME_BASE64
  tls.key: REPLACE_ME_BASE64
